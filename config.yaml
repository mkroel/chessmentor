
# Paths
corners_file: calib/corners.json

# Camera calibration parameters
camera:
  index: 0
  frame_width: 1280
  frame_height: 960
  autofocus: 0
  focus: 30          # 0-255, Schritte von 5
  auto_exposure: 0.25   # 0.25 = manuell, 0.75 = auto (DSHOW)
  exposure: -4          # negativ, -4 heller / -8 dunkler
  auto_wb: 0
  wb_temperature: 4000  # 2800 Glühlampe, 4000 Mischlicht, 6500 Tageslicht
  gain: 0

# Corner detection parameters
corner_threshold: 10  # pixels

# Chess Engine
stockfish_path: stockfish/stockfish-windows-x86-64-avx2.exe
thread_count: 4
depth: 15
movetime: 1000
n_best: 1
